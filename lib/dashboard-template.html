<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Craft: features</title>
<style>
  :root{
    --bg:#0d0f14;--panel:#161922;--panel2:#1c2029;--line:#272c37;
    --ink:#e8eaed;--mut:#9aa3b2;--faint:#6b7280;
    --green:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--violet:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1400px 700px at 80% -10%,#1a1f2b,transparent),var(--bg);
    color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;gap:18px;padding:16px 32px;border-bottom:1px solid var(--line);background:#12151d}
  .topbar .feat{font-weight:700;font-size:16px} .topbar .tag{color:var(--mut);font-size:13.5px;flex:1}
  .live{font-size:11px;color:var(--green);display:inline-flex;align-items:center;gap:6px}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 32px 80px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:30px 0 14px;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px 18px;transition:border-color .15s,transform .1s}
  .card:hover{border-color:var(--blue);transform:translateY(-2px)}
  .card .hd{display:flex;align-items:center;gap:10px}
  .card .name{font-weight:700;font-size:15.5px;flex:1}
  .badge{font-size:10px;font-weight:800;border-radius:5px;padding:2px 8px}
  .badge.done{background:var(--green);color:#0b1220} .badge.in-progress{background:var(--blue);color:#0b1220} .badge.draft{background:var(--panel2);color:var(--faint)}
  .dec-toggle{margin-top:30px}
  .card .tg{color:var(--mut);font-size:12.5px;margin:8px 0 12px;line-height:1.45}
  .phs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .pchip{font-size:11px;border-radius:5px;padding:2px 8px;border:1px solid var(--line);color:var(--mut)}
  .pchip.done{border-color:rgba(52,211,153,.4);color:var(--green)} .pchip.active{border-color:rgba(96,165,250,.5);color:var(--blue)}
  .meta{display:flex;gap:16px;font-size:12px;color:var(--mut);align-items:center}
  .covbar{flex:1;height:6px;border-radius:4px;background:var(--panel2);overflow:hidden} .covbar>i{display:block;height:100%;background:var(--green)}
  .deps{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .deps .lab{font-size:11px;color:var(--faint)}
  .dep{font-size:10.5px;border-radius:5px;padding:2px 7px;background:var(--panel2);color:var(--mut)}
  .dep.done{color:var(--green)} .dep.known{color:var(--blue)}

  .dec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:13.5px;color:var(--mut);line-height:1.6}
  .dec h3{color:var(--ink);font-size:14px;margin:14px 0 6px} .dec h3:first-child{margin-top:0}
  .dec li{margin:3px 0}
  .dec-toggle summary{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600;cursor:pointer;list-style:none;padding:6px 0}
  .dec-toggle summary::-webkit-details-marker{display:none}
  .dec-toggle summary::before{content:'▸  '} .dec-toggle[open] summary::before{content:'▾  '}
  .dec-toggle .dec{margin-top:10px}
  .empty{color:var(--faint);font-size:13px;padding:30px;text-align:center}
  .err{color:var(--red);padding:40px;font:14px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
  <div class="topbar"><span class="feat">Craft</span><span class="tag" id="tag">features</span><span class="live"><i></i>live</span></div>
  <div class="wrap">
    <section><h2>Active</h2><div class="grid" id="features"></div></section>
    <section id="dec-sec"><details class="dec-toggle"><summary>Cross-cutting decisions</summary><div class="dec" id="dec"></div></details></section>
  </div>

  <script>
    const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const ORDER = { 'in-progress':0, 'draft':1, 'done':2 };

    function card(f, known){
      const pct = f.acs.total ? Math.round(f.acs.done/f.acs.total*100) : 0;
      const phs = f.phases.map(p=>`<span class="pchip ${p.state}">${esc(p.label.replace(/^Phase\s*/i,'P'))}</span>`).join('');
      const deps = f.dependsOn.length
        ? `<div class="deps"><span class="lab">depends on</span>`+
          f.dependsOn.map(s=>{ const k=known[s]; const cls=k?(k.status==='done'?'done':'known'):''; return `<span class="dep ${cls}">${esc(s)}</span>`; }).join('')+`</div>`
        : '';
      return `<a class="card" href="/f/${encodeURIComponent(f.slug)}/">`+
        `<div class="hd"><span class="name">${esc(f.feature||f.slug)}</span><span class="badge ${f.status}">${f.status==='in-progress'?'IN PROGRESS':f.status.toUpperCase()}</span></div>`+
        `<div class="tg">${esc(f.tagline||'')}</div>`+
        (phs?`<div class="phs">${phs}</div>`:'')+
        `<div class="meta"><span>AC ${f.acs.done}/${f.acs.total}</span><span class="covbar"><i style="width:${pct}%"></i></span><span>${f.tasks.done}/${f.tasks.total} tasks</span></div>`+
        deps+`</a>`;
    }
    function renderDecisions(md){
      if(!md || !md.trim()) return false;
      const html = md.split('\n').map(l=>{
        if(/^#{1,3}\s/.test(l)) return `<h3>${esc(l.replace(/^#{1,3}\s/,''))}</h3>`;
        if(/^\s*[-*]\s/.test(l)) return `<li>${esc(l.replace(/^\s*[-*]\s/,''))}</li>`;
        return l.trim()?`<div>${esc(l)}</div>`:'';
      }).join('');
      document.getElementById('dec').innerHTML = html;
      return true;
    }
    function render(d){
      const known = {}; d.features.forEach(f=>known[f.slug]=f);
      const feats = d.features.slice().sort((a,b)=>(ORDER[a.status]??9)-(ORDER[b.status]??9));
      document.getElementById('features').innerHTML = feats.length
        ? feats.map(f=>card(f,known)).join('')
        : '<div class="empty">No features with a data.json yet. Run <code>/spec &lt;feature&gt;</code>.</div>';

      document.getElementById('tag').textContent = `${feats.length} active`;
      document.getElementById('dec-sec').style.display = renderDecisions(d.decisions) ? 'block' : 'none';
    }
    fetch('/dashboard.json').then(r=>r.json()).then(d=>{
      render(d);
      try{ const es=new EventSource('/events'); es.onmessage=()=>location.reload(); }catch(e){}
    }).catch(e=>{ document.body.innerHTML='<div class="err">Could not load dashboard.json: '+e+'</div>'; });
  </script>
</body>
</html>
