schema_version: "1.1"
name: plan-flags-shared-file
description: >-
  Plan runs on a slices.md whose two slices both list src/token.js in touches and
  do not wait for each other, so builders would run them at once on the same
  file. Plan has to catch the overlap and leave slices.md with exactly one slice
  owning src/token.js, writing nothing outside the work's folder.
tags: [plan, slices]
context:
  scaffold_script: fixture.sh
