schema_version: "1.1"
name: tweak-has-precedent
description: >-
  The label exists in four places (two locale files, a component and a test).
  Craft's /tweak has to find all four and show them with file:line, agree a
  done-list, and stop before changing anything. A model without the plugin
  edits the files it happens to find. The prompt is written as the explicit
  command because /tweak is disable-model-invocation, and an unknown slash
  command reaches a plugin-less session as plain text, so both arms get a
  comparable request.
tags: [tweak, precedent]
context:
  scaffold_script: fixture.sh
