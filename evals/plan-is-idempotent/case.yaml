schema_version: "1.1"
name: plan-is-idempotent
description: >-
  Plan runs on a plan.md and slices.md that already passed plan and three
  evaluate passes: every acceptance line names its slice, every check fails
  today and says exactly what it prints, and no two slices share a file. With
  nothing changed and nothing open, plan has to change nothing and say so.
tags: [plan, idempotent]
context:
  scaffold_script: fixture.sh
